name: CI

# Releases are git tags, one namespace per artifact (one commit may carry both):
#   vX.Y.Z        plugin (package.json version; `omp plugin upgrade` follows it)
#   relay-vX.Y.Z  relay image -> ghcr.io/fywinds/portcullis:vX.Y.Z
# Each is versioned on its own; argocd-image-updater follows the image's newest
# vX.Y.Z. Branch pushes and plugin tags only run the checks: no image build.
on:
  push:
    branches: [main]
    tags: ["v*", "relay-v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/fywinds/portcullis

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4 # keep in step with mise.toml and relay/Dockerfile
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test

  relay-image:
    needs: check
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/relay-v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=match,pattern=^relay-(v\d+\.\d+\.\d+)$,group=1
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: relay/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=relay
          cache-to: type=gha,mode=max,scope=relay
